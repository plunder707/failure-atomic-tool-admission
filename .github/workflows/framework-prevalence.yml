name: framework-prevalence

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r artifact/framework_prevalence_requirements.txt
      - run: python artifact/run_framework_prevalence.py
      - uses: actions/upload-artifact@v4
        with:
          name: framework-prevalence-result
          path: artifact/results/framework_prevalence.json

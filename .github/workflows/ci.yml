name: artifact-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest==9.1.1
      - run: python artifact/run_fault_injection.py --output /tmp/fault_injection.json
      - run: cmp artifact/results/fault_injection.json /tmp/fault_injection.json
      - run: pytest -q

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "failure-atomic-tool-admission"
version = "0.2.0"
description = "Reproducible research artifact for failure-atomic tool-call admission"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Andrew Gracey"},
]

[project.optional-dependencies]
dev = [
  "matplotlib==3.9.1",
  "pytest==9.1.1",
  "reportlab==4.4.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
